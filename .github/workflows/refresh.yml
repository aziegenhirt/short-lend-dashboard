name: Daily Data Refresh

on:
  schedule:
    # Runs at 21:15 UTC = 5:15pm ET (after US market close)
    # Weekdays only via the day-of-week field
    - cron: '15 21 * * 1-5'
  workflow_dispatch:  # allow manual run from the Actions tab

permissions:
  contents: write  # needed to commit data.json back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run refresh script
        run: python refresh.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
